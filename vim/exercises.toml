# ── Beginner ──────────────────────────────────────────────────────────────────

[[exercises]]
level = "beginner"
task = '''
Vim movement practice

- Move up, right, down, and left by character.
- Move right and left by word, and move to word endings.
- Move to the absolute start of a line, the first non-whitespace character, and the end of a line.
- Jump to the first line, last line, and a specific line number in the file.
- Find a character on the current line, jump before a character, and repeat or reverse that find motion.
- Jump between matching brackets, parentheses, and braces.
- Move the cursor to the top, middle, and bottom of the visible screen without scrolling.
- Reposition the current line on screen and scroll by half-pages and full pages.
'''
hint = '''
h / j / k / l      — left / down / up / right
w / b / e          — next word start / previous word start / next word end
W / B / E          — word motions that only split on whitespace
0 / ^ / $          — absolute line start / first non-whitespace / line end
gg / G             — first line / last line
42G                — jump to line 42  (also :42<Enter>)
f{char} / F{char}  — jump forward / backward to char on current line
t{char} / T{char}  — jump forward / backward just before / after char
; / ,              — repeat the last f/F/t/T forward / backward
%                  — jump to matching (), [], or {}
H / M / L          — top / middle / bottom of visible screen
zz / zt / zb       — center current line / move it to top / move it to bottom
Ctrl-d / Ctrl-u    — scroll half page down / up
Ctrl-f / Ctrl-b    — scroll full page down / up
'''

[[exercises]]
level = "beginner"
task = '''
Insert-mode entry practice

- Enter insert mode before the cursor.
- Enter insert mode after the cursor.
- Enter insert mode at the first non-whitespace character on the current line.
- Enter insert mode at the end of the current line.
- Open a new blank line below the current line and enter insert mode.
- Open a new blank line above the current line and enter insert mode.
'''
hint = '''
i  — insert before cursor
a  — insert after cursor (append)
I  — insert at first non-whitespace on line
A  — insert at end of line
o  — open new line below, enter insert mode
O  — open new line above, enter insert mode
'''

[[exercises]]
level = "beginner"
task = '''
Delete, change, and replace practice

- Delete the character under the cursor.
- Delete the current line.
- Delete from the cursor to the end of the line.
- Delete by word, including both inner-word and around-word variants.
- Delete up to a target character and through a target character on the current line.
- Change from the cursor to the end of the line.
- Change a word from the cursor position or change the whole inner word.
- Change up to a target character on the current line.
- Replace a single character without staying in insert mode.
- Undo, redo, and repeat the last normal-mode change.
'''
hint = '''
x          — delete character under cursor
dd         — delete current line
D / d$     — delete from cursor to end of line
dw         — delete to start of next word
daw / diw  — delete word with / without surrounding whitespace
dt{char}   — delete up to, but not including, the next {char}
df{char}   — delete through, including, the next {char}
C / c$     — change from cursor to end of line
cw / ciw   — change to end of word / change whole inner word
ct{char}   — change up to, but not including, the next {char}
r{char}    — replace character under cursor and return to normal mode
u / Ctrl-r — undo / redo
.          — repeat the last normal-mode change
'''

[[exercises]]
level = "beginner"
task = '''
Copy, paste, and visual selection practice

- Yank the current line.
- Paste copied or deleted text below or after the cursor.
- Paste copied or deleted text above or before the cursor.
- Enter character-wise visual mode.
- Enter line-wise visual mode.
- Enter block visual mode.
- Yank, delete, or change text from a visual selection.
'''
hint = '''
yy      — yank current line
p / P   — paste below or after cursor / paste above or before cursor
v       — character-wise visual mode
V       — line-wise visual mode
Ctrl-v  — block visual mode
In visual mode: y yanks, d deletes, c changes the selection.
'''

[[exercises]]
level = "beginner"
task = '''
File command practice

- Save the current file.
- Quit the current file.
- Quit without saving changes.
- Save and quit in one command.
'''
hint = '''
:w    — save (write)
:q    — quit
:q!   — quit without saving
:wq   — save and quit  (also :x)
'''

# ── Intermediate ──────────────────────────────────────────────────────────────

[[exercises]]
level = "intermediate"
task = '''
Text object and register practice

- Change text inside double quotes, single quotes, parentheses, brackets, and braces without deleting the delimiters.
- Change text around those same delimiters, including the delimiters themselves.
- Yank text inside parentheses into a named register.
- Switch to another buffer and paste from that named register.
- Inspect register contents after yanking.
'''
hint = '''
ci" / ci'  — change inside double / single quotes
ci( / ci[ / ci{  — change inside parentheses / brackets / braces
ca" / ca'  — change around double / single quotes, including delimiters
ca( / ca[ / ca{  — change around parentheses / brackets / braces
"ayi(      — yank inner parentheses into register 'a'
:bn        — switch to next buffer  (or Ctrl-^ for alternate file)
"ap        — paste from register 'a'
:registers — inspect all register contents
'''

[[exercises]]
level = "intermediate"
task = '''
Search and substitution practice

- Search forward and backward for a typed pattern.
- Move through search matches in both directions.
- Search for the exact word under the cursor.
- Replace a word on the current line.
- Replace every occurrence of a word in the whole file.
- Repeat the whole-file replacement with confirmation on each match.
- Replace a word only inside a visual selection.
'''
hint = '''
/pattern<Enter>   — forward search
?pattern<Enter>   — backward search
n / N             — next match / previous match
* / #             — search forward / backward for word under cursor
g* / g#           — search word under cursor without word boundaries
:s/old/new/g      — replace on current line only
:%s/old/new/g     — replace all occurrences in file
:%s/old/new/gc    — confirm each replacement
V then :          — Vim fills in :'<,'> for the visual range
:'<,'>s/old/new/g — replace only inside the visual selection
'''

[[exercises]]
level = "intermediate"
task = '''
Marks and navigation history practice

- Set a local mark on the current line.
- Move far away, then jump back to the exact cursor position of that mark.
- Jump back to only the line of that mark.
- Navigate backward and forward through the jump list.
- Navigate backward and forward through the change list.
- Inspect the mark, jump, and change lists.
'''
hint = '''
m{a-z}    — set a local mark, e.g. ma
`{a-z}    — jump to exact position of mark
'{a-z}    — jump to line of mark
:marks    — list marks
Ctrl-o    — jump to older position in jump list
Ctrl-i    — jump to newer position in jump list
:jumps    — display jump list
g; / g,   — older / newer position in change list
:changes  — display change list
'''

[[exercises]]
level = "intermediate"
task = '''
Macro recording and editing practice

- Record a macro that appends a semicolon to the end of a line.
- Replay that macro once, replay the last-used macro, and replay it with a count.
- Paste a recorded macro into the buffer as text.
- Edit the macro text in place.
- Yank the edited macro text back into the same register.
'''
hint = '''
qa          — start recording into register 'a'
A;<Esc>     — append semicolon, leave insert mode
q           — stop recording
@a          — replay macro 'a'
@@          — replay the last-used macro
5@a         — replay 5 times
"ap         — paste macro contents as text
"ayy        — yank edited line back into register 'a'
:let @a='<Ctrl-r a>'  — edit macro string inline
'''

[[exercises]]
level = "intermediate"
task = '''
Windows, buffers, tabs, and file browsing practice

- Split the current window horizontally and vertically.
- Open a specific file in a horizontal or vertical split.
- Move focus between splits, equalize split sizes, and close a split.
- List open buffers, switch by number, move to next and previous buffers, and close a buffer.
- Toggle between the current and alternate buffer.
- Browse files with netrw and open files from the browser.
- Open a new tab, move between tabs, jump to a numbered tab, and close a tab.
- Yank text in one split, switch to another split, and paste it there.
'''
hint = '''
:sp / :split          — horizontal split
:vs / :vsplit         — vertical split
:sp filename          — open file in horizontal split
:vs filename          — open file in vertical split
Ctrl-w h/j/k/l        — move focus left/down/up/right
Ctrl-w w / = / q      — cycle splits / equalize / close current split
:ls / :buffers        — list buffers (# = alternate, % = current)
:b{N}                 — switch to buffer N
:bn / :bp             — next / previous buffer
:bd / :bd{N}          — close current buffer / close buffer N
Ctrl-^ or Ctrl-6      — toggle current and alternate buffer
:Ex / :Explore        — open netrw in current window
:Sex / :Vex           — netrw in horizontal / vertical split
<Enter> / -           — open file or directory / go up one directory
v / o                  — open netrw file in vertical / horizontal split
:tabnew filename      — open file in new tab
gt / gT / {N}gt       — next tab / previous tab / go to tab N
:tabc                 — close current tab
yy, V then y, p       — yank normally and paste across splits or tabs
"ay / "ap             — use register 'a' for explicit copy and paste
'''

[[exercises]]
level = "intermediate"
task = '''
Formatting and line transformation practice

- Indent and dedent the current line.
- Indent or dedent a visual selection.
- Auto-indent a line, a block, a visual selection, and the entire file.
- Toggle the case of one character.
- Uppercase and lowercase a motion, a word, a line, and a visual selection.
- Join the current line with the line below, with and without inserting a space.
'''
hint = '''
>> / <<       — indent / dedent current line
> / <         — indent / dedent visual selection
5>>           — indent 5 lines from cursor downward
==            — auto-indent current line
=G            — auto-indent from cursor to end of file
=ip           — auto-indent inner paragraph
gg=G          — auto-indent entire file
~             — toggle case of character under cursor
gU{motion}    — uppercase motion, e.g. gUiw
gu{motion}    — lowercase motion
gUU / guu     — uppercase / lowercase entire line
U / u / ~     — uppercase / lowercase / toggle visual selection
J / gJ        — join next line with / without a space
3J            — join the next 3 lines
'''

[[exercises]]
level = "intermediate"
task = '''
Counted command practice

- Move several words or lines with one counted motion.
- Delete several words or lines with one counted operator.
- Indent multiple lines with one counted operator.
- Apply counts to motions and operators until the pattern feels automatic.
'''
hint = '''
{count}{motion}    — e.g. 5w, 3j, 4b
{count}{operator}  — e.g. 3dd, 2dw, 5>>
Counts work with almost every operator and motion.
'''

# ── Advanced ──────────────────────────────────────────────────────────────────

[[exercises]]
level = "advanced"
task = '''
Batch Ex command practice

- Run an Ex command on every line that matches a pattern.
- Run an Ex command on every line that does not match a pattern.
- Run a normal-mode command on an explicit line range.
- Run a normal-mode command on every line in the file.
- Run a normal-mode command on a visual selection.
- Apply a recorded macro to every line in a visual selection.
'''
hint = '''
:g/pattern/command      — run command on matching lines
:g/TODO/d               — delete all lines containing TODO
:g/^$/d                 — delete all blank lines
:g/pattern/norm dd      — run normal command on each matching line
:g/pattern/p            — print matching lines
:v/pattern/d            — delete all lines NOT matching
:5,15norm I//           — prepend // to lines 5-15
:%norm A;               — append ; to every line in file
:'<,'>norm {cmd}        — run normal command on visual selection
:'<,'>norm @a           — apply macro 'a' to every selected line
'''

[[exercises]]
level = "advanced"
task = '''
Block visual editing practice

- Select a rectangular block across multiple lines.
- Delete a rectangular column of text.
- Insert the same text at the beginning of several selected lines.
- Append the same text after a block across several selected lines.
'''
hint = '''
Ctrl-v       — enter block visual mode
j/k          — extend selection up/down
h/l          — extend selection left/right
d or x       — delete selected block
I            — insert before the block
A            — append after the block
Esc          — apply inserted text to every selected line
'''

[[exercises]]
level = "advanced"
task = '''
Shell command and file insertion practice

- Filter the entire file through a shell command.
- Filter only a visual selection through a shell command.
- Insert the output of a shell command below the current cursor line.
- Insert command output at the top of the file.
- Insert the entire contents of another file below the cursor or at the top of the buffer.
'''
hint = '''
:%!sort                 — pipe whole file through sort
:'<,'>!sort             — pipe visual selection through sort
:%!python3 -m json.tool — pretty-print JSON
:%!column -t            — align columns with whitespace
:r !command             — insert command stdout below cursor
:r !date                — insert current date
:0r !command            — insert command output at top of file
:r filename             — insert file contents below current line
:0r filename            — insert file contents at top of buffer
'''

[[exercises]]
level = "advanced"
task = '''
Project-wide and multi-buffer edit practice

- Build an argument list of files to edit.
- Run a substitution across every file in the argument list and save changed files.
- List or reload the current argument list.
- Run a substitution across every open buffer and save changed buffers.
- Suppress pattern-not-found errors so batch edits do not abort early.
'''
hint = '''
:args *.py                     — load all .py files into arg list
:args                          — list current arg list
:argdo %s/old/new/ge | update  — replace in all arg files and save changes
:argdo e                       — reload all arg files from disk
:bufdo %s/old/new/ge | update  — replace in all open buffers and save changes
ge                             — suppress pattern-not-found errors
update                         — save only buffers that changed
'''

[[exercises]]
level = "advanced"
task = '''
Quickfix, location list, and project search practice

- Search recursively for a pattern across project files and populate the quickfix list.
- Open the quickfix list, navigate through entries, jump to a specific entry, and close it.
- Open the per-window location list, navigate through entries, and close it.
- Compare when quickfix is global and when location list is per-window.
'''
hint = '''
:vimgrep /pattern/gj **/*.py  — search all .py files without jumping first
:grep pattern **/*            — external grep, faster on large projects
:copen / :cclose              — open / close quickfix window
:cn / :cp                     — next / previous quickfix entry
:cc{N}                        — jump to quickfix entry N
:cfirst / :clast              — first / last quickfix entry
:lopen / :lclose              — open / close location list
:ln / :lp                     — next / previous location entry
Quickfix is global; location lists are per-window.
:make, :grep, :vimgrep, LSP, and plugins can populate these lists.
'''

[[exercises]]
level = "advanced"
task = '''
Code navigation and cross-file mark practice

- Generate and use a ctags index to jump to a definition.
- Jump back up the tag stack after visiting a definition.
- Jump to a named tag and move through multiple tag matches.
- Jump to the local or global declaration of the word under the cursor without a tags file.
- Set a global mark in one file, open another file, and jump back to the exact marked position.
'''
hint = '''
ctags -R .    — generate tags in project root
Ctrl-]        — jump to tag definition under cursor
Ctrl-t        — jump back up the tag stack
:tag {name}   — jump to named tag
:tn / :tp     — next / previous tag match
:tags         — show tag stack
gd / gD       — go to local / global declaration under cursor
No tags file is needed for gd or gD; Vim searches the current buffer.
mA            — set global mark A
`A / 'A       — jump to exact position / line of global mark A
:marks        — list marks, including globals
'''

[[exercises]]
level = "advanced"
task = '''
Prose reformatting and spellcheck practice

- Set a target text width.
- Reformat the current paragraph, a motion, the current line, and a visual selection.
- Enable and disable spell checking.
- Jump between misspelled words.
- Get correction suggestions, add a word to the dictionary, and mark a word as misspelled.
'''
hint = '''
:set textwidth=80  — set wrapping width
gqap               — reformat current paragraph
gq{motion}         — reformat a motion
gqq                — reformat current line
gq                 — reformat visual selection
:set spell         — enable spell check
:set nospell       — disable spell check
]s / [s            — next / previous misspelling
z=                 — correction suggestions for word under cursor
zg / zw            — add word to dictionary / mark word as misspelled
'''

[[exercises]]
level = "advanced"
task = '''
Fold practice

- Create a manual fold over a range of lines.
- Open, close, and toggle the fold under the cursor.
- Open all folds in the file.
- Close all folds in the file.
- Switch to indentation-based folding.
'''
hint = '''
zf{motion}             — create manual fold, e.g. zf5j
zo / zc / za           — open / close / toggle fold under cursor
zR / zM                — open all folds / close all folds
:set foldmethod=indent — auto-fold by indentation level
'''

[[exercises]]
level = "advanced"
task = '''
Neovim terminal practice

- Open a terminal buffer inside Neovim.
- Run a command in terminal-insert mode.
- Leave terminal mode and return to normal mode.
- Treat the terminal buffer like a regular buffer once back in normal mode.
'''
hint = '''
:terminal or :term  — open terminal buffer
i or a              — enter terminal-insert mode
Ctrl-\ Ctrl-n       — leave terminal mode and return to normal mode
'''
